services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: literature
      MYSQL_USER: literature
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-literature}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    # Spring AI 1.1.8 brings Qdrant Java client 1.13.x. Keep the server within
    # one minor version of the client until Spring AI upgrades that dependency.
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Do not mount the v1.18 storage into an older server. Vector data is a
      # rebuildable index, so this compatible server starts from a fresh volume.
      - qdrant-data-v1-14:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  qdrant-data-v1-14:
