spring:
  datasource:
    url: jdbc:h2:mem:literature;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      repositories:
        enabled: false
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    vectorstore:
      type: none

app:
  auth:
    secret: test-secret-that-is-at-least-32-bytes-long
    token-ttl-seconds: 3600
    required: false
  storage:
    local-root: ./target/test-uploads
    lucene-root: ./target/test-lucene
  retrieval:
    min-score: 0.65
    candidate-multiplier: 4
    default-strategy: VECTOR
  reranker:
    enabled: false
    base-url: http://localhost:8000
    api-key:
    model: test-reranker
    timeout-millis: 1000
  conversation:
    cache-ttl-minutes: 30
