spring:
  application:
    name: literature-answering-system
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/literature?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:literature}
    password: ${MYSQL_PASSWORD:literature}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    vectorstore:
      type: none
      qdrant:
        initialize-schema: false

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    secret: ${APP_AUTH_SECRET:change-this-development-secret-to-at-least-32-bytes}
    token-ttl-seconds: ${APP_AUTH_TOKEN_TTL_SECONDS:86400}
    required: ${APP_AUTH_REQUIRED:true}
  storage:
    local-root: ${APP_STORAGE_LOCAL_ROOT:./data/uploads}
    lucene-root: ${APP_STORAGE_LUCENE_ROOT:./data/lucene}
  documents:
    max-file-size-bytes: 52428800
    max-pages: 500
    chunk-size: 1200
    chunk-overlap: 200
  retrieval:
    min-score: ${APP_RETRIEVAL_MIN_SCORE:0.65}
    candidate-multiplier: ${APP_RETRIEVAL_CANDIDATE_MULTIPLIER:4}
    default-strategy: ${APP_RETRIEVAL_DEFAULT_STRATEGY:HYBRID_RRF}
  reranker:
    enabled: ${RERANK_ENABLED:false}
    base-url: ${RERANK_BASE_URL:http://localhost:8000}
    api-key: ${RERANK_API_KEY:}
    model: ${RERANK_MODEL:rerank-v3.5}
    timeout-millis: ${RERANK_TIMEOUT_MILLIS:10000}
  conversation:
    cache-ttl-minutes: 30
  ai:
    enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
